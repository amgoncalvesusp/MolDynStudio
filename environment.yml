name: moldynstudio
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # MDAnalysis 2.10 reads TPR through GROMACS 2025; keep the default pipeline compatible.
  - gromacs=2025.4
  - ambertools=23
  - openbabel>=3.1
  - parmed=4.3.1
  - gmx_mmpbsa
  - mdanalysis
  - mdtraj<1.11
  - prody
  - matplotlib
  - seaborn
  - numpy>=1.26,<2
  - pandas
  - scipy
  - openpyxl
  - pip:
      - py3dmol
      - acpype
