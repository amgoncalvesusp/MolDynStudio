name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Unit, integration, and GUI smoke tests
        run: python -m coverage run -m unittest discover -s tests

      - name: Enforce core coverage
        run: python -m coverage report

      - name: Lint
        run: python -m ruff check . --exclude dist --exclude build/MolDynStudio

      - name: Compile Python sources
        run: python -m compileall -q analysis core tabs utils windows build main.py setup_wizard.py setup_environment.py settings_dialog.py gromacs_analysis_studio_v11.py

      - name: Build Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python build/create_linux_installer.py
          bash -n dist/MolDynStudio-linux-x86_64.run
          test -x dist/MolDynStudio-linux-x86_64.run

      - name: Build Windows executable and archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build/create_installer.py
          Compress-Archive -Path dist/MolDynStudio.exe -DestinationPath dist/MolDynStudio-windows-x86_64.zip -Force
          if (-not (Test-Path -LiteralPath dist/MolDynStudio-windows-x86_64.zip)) { throw "Windows archive was not created" }

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/MolDynStudio-linux-x86_64.run
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/MolDynStudio-windows-x86_64.zip
          if-no-files-found: error
